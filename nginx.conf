server {
    listen 7070;
    server_name 72.61.209.205;  # Ganti dengan domain kamu kalau sudah ada

    root /var/www/task-management;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets (JS/CSS/images hasil build Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — WAJIB untuk React Router
    # Semua route yang tidak ada filenya diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}